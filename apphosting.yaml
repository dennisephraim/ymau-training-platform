# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Firebase Client Configuration (public - exposed to browser)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAodqhIgubLOEsySrPjVTCAfOwasxf2kzc
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ymau-delegate-hub.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ymau-delegate-hub
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ymau-delegate-hub.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "646847187741"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:646847187741:web:f2cb4fd3ef6cb7642caff4
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: https://ymau-delegate-hub.web.app
    availability:
      - BUILD
      - RUNTIME

  # Server-side secrets (reference from Google Secret Manager)
  # Uncomment and create these secrets if you add server-side API keys:
